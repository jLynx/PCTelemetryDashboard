<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PC Telemetry Dashboard</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      color-scheme: dark;
      --bg: #242625;
      --surface: #385f6d;
      --surface-2: #2d5361;
      --surface-3: #1f363e;
      --text: #f4f7f8;
      --muted: #b9c9cf;
      --quiet: #8ea5ae;
      --line: rgba(230, 243, 247, 0.28);
      --border: rgba(255, 255, 255, 0.08);
      --accent: #a6f20f;
      --accent-soft: rgba(166, 242, 15, 0.16);
      --warn: #ffca4f;
      --bad: #ff7a7a;
      --shadow: 0 8px 18px rgba(0, 0, 0, 0.28);
      --chart-1: #9be870;
      --chart-2: #63c8ff;
      --chart-3: #ffb25b;
      --chart-4: #d28cff;
      --chart-5: #ff7f99;
      --chart-6: #67e0c5;
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--text);
    }

    button,
    select {
      font: inherit;
    }

    button,
    .button-link {
      min-height: 2rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #303332;
      color: var(--text);
      padding: 0.35rem 0.65rem;
      text-decoration: none;
      cursor: pointer;
    }

    button:hover,
    .button-link:hover {
      border-color: var(--accent);
    }

    button.danger {
      border-color: rgba(255, 122, 122, 0.42);
      color: #ffd0d0;
    }

    button:disabled {
      cursor: default;
      opacity: 0.62;
    }

    .view-tabs button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #172009;
    }

    select {
      min-height: 2rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #303332;
      color: var(--text);
      padding: 0.3rem 0.5rem;
    }

    .page {
      width: min(1580px, calc(100% - 24px));
      margin: 0 auto;
      padding: 14px 0 28px;
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 12px;
    }

    h1,
    h2 {
      margin: 0;
      font-weight: 600;
      letter-spacing: 0;
    }

    h1 {
      font-size: 1.3rem;
    }

    h2 {
      font-size: 1rem;
      margin-bottom: 8px;
    }

    .subtle {
      color: var(--muted);
      font-size: 0.86rem;
    }

    .header-actions,
    .status-row,
    .tools,
    .view-tabs,
    .legend {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      min-height: 2rem;
      border-radius: 999px;
      background: #303332;
      padding: 0.25rem 0.65rem;
      font-size: 0.86rem;
    }

    .status-dot {
      width: 0.58rem;
      height: 0.58rem;
      border-radius: 999px;
      background: var(--warn);
    }

    .status-dot.good {
      background: var(--accent);
    }

    .status-dot.bad {
      background: var(--bad);
    }

    .notice {
      display: none;
      border: 1px solid rgba(255, 202, 79, 0.35);
      border-radius: 6px;
      background: rgba(255, 202, 79, 0.09);
      color: #ffe0a3;
      padding: 8px 10px;
      margin-bottom: 12px;
    }

    .notice.visible {
      display: block;
    }

    .group {
      margin-bottom: 16px;
    }

    .group-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .group-head h2 {
      margin-bottom: 0;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 12px;
    }

    .sensor-card {
      position: relative;
      min-height: 112px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: linear-gradient(180deg, var(--surface), var(--surface-2));
      box-shadow: var(--shadow);
      color: var(--text);
      padding: 12px;
      overflow: hidden;
      text-align: left;
    }

    .sensor-card.active {
      border-color: var(--accent);
      box-shadow: inset 0 0 0 1px var(--accent), 0 0 0 2px var(--accent-soft), var(--shadow);
    }

    .sensor-card.missing.active {
      border-color: var(--border);
      box-shadow: var(--shadow);
    }

    .sensor-card.missing {
      opacity: 0.58;
    }

    .sensor-card .topline {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-width: 0;
    }

    .sensor-card .name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 600;
    }

    .sensor-card .hardware {
      position: relative;
      z-index: 1;
      margin-top: 3px;
      color: var(--muted);
      font-size: 0.75rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sensor-card .value-row {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 8px;
      margin-top: 22px;
      font-variant-numeric: tabular-nums;
    }

    .sensor-card .value,
    .sensor-card .rpm {
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.72);
    }

    .sensor-card .value {
      font-size: 1.45rem;
      font-weight: 600;
      letter-spacing: 0;
    }

    .sensor-card .rpm {
      color: var(--muted);
      font-size: 1rem;
      white-space: nowrap;
    }

    .sensor-card .mini-curve {
      position: absolute;
      inset: auto 0 0 0;
      width: 100%;
      height: 34px;
      opacity: 0.56;
      pointer-events: none;
      z-index: 0;
    }

    .sensor-card .spark {
      fill: rgba(255, 255, 255, 0.09);
      stroke: rgba(255, 255, 255, 0.58);
      stroke-width: 2;
    }

    .sensor-card .dot {
      fill: var(--accent);
    }

    .main-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) minmax(320px, 0.85fr);
      gap: 14px;
      align-items: start;
    }

    .panel {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #282b2a;
      box-shadow: var(--shadow);
      padding: 12px;
    }

    .panel-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .chart-wrap {
      width: 100%;
      min-height: 340px;
    }

    #trend-chart {
      width: 100%;
      height: 340px;
      display: block;
    }

    .axis-line {
      stroke: var(--line);
      stroke-width: 1;
    }

    .grid-line {
      stroke: var(--line);
      stroke-width: 1;
      opacity: 0.42;
    }

    .axis-text,
    .chart-label {
      fill: var(--muted);
      font-size: 12px;
    }

    .series-line {
      fill: none;
      stroke-width: 2.2;
      vector-effect: non-scaling-stroke;
    }

    .legend {
      margin-top: 8px;
    }

    .legend-item {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 0.86rem;
    }

    .swatch {
      width: 0.7rem;
      height: 0.7rem;
      border-radius: 99px;
      flex: 0 0 auto;
    }

    .table-scroll {
      overflow: auto;
      max-height: 420px;
      border: 1px solid var(--border);
      border-radius: 6px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 100%;
      background: #252827;
    }

    th,
    td {
      padding: 8px 9px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
      overflow-wrap: anywhere;
    }

    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #303332;
      color: var(--muted);
      font-weight: 600;
      font-size: 0.82rem;
    }

    td.value {
      text-align: right;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    th:nth-child(3),
    td:nth-child(3) {
      white-space: nowrap;
    }

    .log-path {
      color: var(--quiet);
      font-family: Consolas, "Courier New", monospace;
      font-size: 0.78rem;
      overflow-wrap: anywhere;
    }

    @media (max-width: 1080px) {
      header,
      .panel-head {
        flex-direction: column;
      }

      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 620px) {
      .page {
        width: min(100% - 18px, 1580px);
      }

      .header-actions,
      .tools,
      .view-tabs {
        align-items: stretch;
        flex-direction: column;
      }

      button,
      .button-link,
      select {
        width: 100%;
      }

      .card-grid {
        grid-template-columns: 1fr;
      }

      .chart-wrap {
        min-height: 300px;
      }

      #trend-chart {
        height: 300px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div>
        <h1>PC telemetry</h1>
        <div class="status-row subtle">
          <span id="last-sample">Waiting for first sample</span>
          <span id="sensor-count"></span>
        </div>
      </div>
      <div class="header-actions">
        <span class="status-pill"><span id="status-dot" class="status-dot"></span><span id="status-text">Starting</span></span>
        <button id="new-log" type="button">New log</button>
        <button id="reset-log" class="danger" type="button">Reset log</button>
        <button id="copy-summary" type="button">Copy summary</button>
        <a class="button-link" href="/api/export">Download CSV</a>
      </div>
    </header>

    <div id="notice" class="notice"></div>

    <section class="group" aria-label="Temperature sources">
      <h2>Temperatures</h2>
      <div id="temperature-grid" class="card-grid"></div>
    </section>

    <section class="group" aria-label="Load and power sources">
      <h2>Load / Power</h2>
      <div id="performance-grid" class="card-grid"></div>
    </section>

    <section class="group" aria-label="Fan outputs">
      <div class="group-head">
        <h2>Fans</h2>
        <button id="toggle-optional-fans" type="button">Show optional fans</button>
      </div>
      <div id="fan-grid" class="card-grid"></div>
    </section>

    <div class="main-grid">
      <section class="panel" aria-label="Telemetry chart">
        <div class="panel-head">
          <div>
            <h2 id="chart-heading">Temperature trend</h2>
            <div id="chart-caption" class="subtle">Select temperature or fan cards to choose chart lines</div>
          </div>
          <div class="tools">
            <div class="view-tabs" role="group" aria-label="Chart type">
              <button type="button" class="active" data-view="temperature">Temperature</button>
              <button type="button" data-view="loadPercent">Load %</button>
              <button type="button" data-view="power">Power W</button>
              <button type="button" data-view="fanPercent">Fan %</button>
              <button type="button" data-view="fanRpm">RPM</button>
            </div>
            <select id="range-select" aria-label="Time window">
              <option value="15">15 min</option>
              <option value="30" selected>30 min</option>
              <option value="60">1 hour</option>
              <option value="180">3 hours</option>
              <option value="360">6 hours</option>
            </select>
            <button id="pause-refresh" type="button">Pause</button>
          </div>
        </div>
        <div class="chart-wrap">
          <svg id="trend-chart" role="img" aria-labelledby="chart-title chart-desc">
            <title id="chart-title">Telemetry trend chart</title>
            <desc id="chart-desc">Line chart of selected PC sensor values over time.</desc>
          </svg>
        </div>
        <div id="legend" class="legend" aria-label="Selected chart sensors"></div>
      </section>

      <section class="panel" aria-label="Focused readings">
        <div class="panel-head">
          <div>
            <h2>Current readings</h2>
            <div id="table-count" class="subtle">Only configured sensors are shown</div>
          </div>
          <div id="log-path" class="log-path"></div>
        </div>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Hardware</th>
                <th>Type</th>
                <th class="value">Value</th>
              </tr>
            </thead>
            <tbody id="sensor-table">
              <tr><td colspan="4">Waiting for sensor data...</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </div>

  <script>
    const temperatureConfig = [
      { key: "cpu-core", label: "Core (Tctl/Tdie)", hardware: "AMD Ryzen 9 9950X", names: ["Core (Tctl/Tdie)", "CPU Package", "Package"] },
      { key: "ccd1", label: "CCD1 (Tdie)", hardware: "AMD Ryzen 9 9950X", names: ["CCD1 (Tdie)", "CCD1"] },
      { key: "ccd2", label: "CCD2 (Tdie)", hardware: "AMD Ryzen 9 9950X", names: ["CCD2 (Tdie)", "CCD2"] },
      { key: "ccds-max", label: "CCDs Max (Tdie)", hardware: "AMD Ryzen 9 9950X", names: ["CCDs Max (Tdie)", "CCD Max"] },
      { key: "ccds-average", label: "CCDs Average (Tdie)", hardware: "AMD Ryzen 9 9950X", names: ["CCDs Average (Tdie)", "CCD Average"] },
      { key: "igpu-soc", label: "GPU VR SoC", hardware: "AMD Radeon(TM) Graphics", names: ["GPU VR SoC"] },
      { key: "system-1", label: "System #1", hardware: "Gigabyte X870 AORUS ELITE WIFI7", names: ["System #1", "System 1", "Temperature #1"] },
      { key: "pch", label: "PCH", hardware: "Gigabyte X870 AORUS ELITE WIFI7", names: ["PCH"] },
      { key: "cpu-board", label: "CPU", hardware: "Gigabyte X870 AORUS ELITE WIFI7", names: ["CPU"] },
      { key: "pcie-x16", label: "PCIe x16", hardware: "Gigabyte X870 AORUS ELITE WIFI7", names: ["PCIe x16", "PCIEX16"] },
      { key: "vrm-mos", label: "VRM MOS", hardware: "Gigabyte X870 AORUS ELITE WIFI7", names: ["VRM MOS", "VRM"] },
      { key: "pcie-x4", label: "PCIe x4", hardware: "Gigabyte X870 AORUS ELITE WIFI7", names: ["PCIe x4", "PCIEX4"] },
      { key: "system-2", label: "System #2", hardware: "Gigabyte X870 AORUS ELITE WIFI7", names: ["System #2", "System 2", "Temperature #2"] },
      { key: "nvidia-gpu", label: "GPU", hardware: "NVIDIA GeForce RTX 5070 Ti", names: ["GPU", "GPU Core"] }
    ];

    const performanceConfig = [
      { key: "cpu-total-load", label: "CPU Total", hardware: "AMD Ryzen 9 9950X", sensorType: "Load", chartView: "loadPercent", unit: "%", exactNameOnly: true, names: ["CPU Total"] },
      { key: "cpu-core-max-load", label: "CPU Core Max", hardware: "AMD Ryzen 9 9950X", sensorType: "Load", chartView: "loadPercent", unit: "%", exactNameOnly: true, names: ["CPU Core Max"] },
      { key: "gpu-core-load", label: "GPU Core", hardware: "NVIDIA GeForce RTX 5070 Ti", sensorType: "Load", chartView: "loadPercent", unit: "%", exactNameOnly: true, names: ["GPU Core", "GPU"] },
      { key: "gpu-memory-controller-load", label: "GPU Memory Controller", hardware: "NVIDIA GeForce RTX 5070 Ti", sensorType: "Load", chartView: "loadPercent", unit: "%", exactNameOnly: true, names: ["GPU Memory Controller", "Memory Controller"] },
      { key: "cpu-package-power", label: "CPU Package Power", hardware: "AMD Ryzen 9 9950X", sensorType: "Power", chartView: "power", unit: "W", exactNameOnly: true, names: ["Package", "CPU Package", "CPU Package Power"] },
      { key: "gpu-power", label: "GPU Power", hardware: "NVIDIA GeForce RTX 5070 Ti", sensorType: "Power", chartView: "power", unit: "W", exactNameOnly: true, names: ["GPU Package", "GPU Power", "Total Board Power", "Board Power"] }
    ];

    const fanConfig = [
      { key: "rad-1", label: "Rad Fan 1", hardware: "Gigabyte X870 AORUS ELITE WIFI7", exactNameOnly: true, names: ["System Fan #3", "Fan #3", "Fan 3", "SYS Fan 3"] },
      { key: "rad-2", label: "Rad Fan 2", hardware: "Gigabyte X870 AORUS ELITE WIFI7", exactNameOnly: true, names: ["System Fan #2", "Fan #2", "Fan 2", "SYS Fan 2"] },
      { key: "io", label: "IO Fan", hardware: "Gigabyte X870 AORUS ELITE WIFI7", exactNameOnly: true, names: ["CPU Optional Fan", "CPU OPT Fan", "CPU_OPT"] },
      { key: "pcie", label: "PCIe Fan", hardware: "Gigabyte X870 AORUS ELITE WIFI7", exactNameOnly: true, names: ["CPU Fan", "CPU_FAN"] },
      { key: "right-exhaust", label: "Right Fan Exhaust", hardware: "Gigabyte X870 AORUS ELITE WIFI7", exactNameOnly: true, names: ["System Fan #1", "Fan #1", "Fan 1", "SYS Fan 1"] },
      { key: "cpu-pump", label: "CPU Pump", hardware: "Gigabyte X870 AORUS ELITE WIFI7", hidden: true, exactNameOnly: true, names: ["System Fan #5 / Pump", "System Fan #5", "Fan #5", "Fan 5", "SYS Fan 5", "Pump"] },
      { key: "gpu-1", label: "GPU Fan 1", hardware: "NVIDIA GeForce RTX 5070 Ti", hidden: true, exactNameOnly: true, names: ["GPU Fan 1", "Control 1 - NVIDIA GeForce RTX 5070 Ti", "Fan 1 - NVIDIA GeForce RTX 5070 Ti"] },
      { key: "gpu-2", label: "GPU Fan 2", hardware: "NVIDIA GeForce RTX 5070 Ti", hidden: true, exactNameOnly: true, names: ["GPU Fan 2", "Control 2 - NVIDIA GeForce RTX 5070 Ti", "Fan 2 - NVIDIA GeForce RTX 5070 Ti"] },
      { key: "gpu-3", label: "GPU Fan 3", hardware: "NVIDIA GeForce RTX 5070 Ti", hidden: true, exactNameOnly: true, names: ["GPU Fan 3", "Control 3 - NVIDIA GeForce RTX 5070 Ti", "Fan 3 - NVIDIA GeForce RTX 5070 Ti"] }
    ];

    const state = {
      view: "temperature",
      minutes: 30,
      selected: new Set(temperatureConfig.map(item => item.key)),
      showOptionalFans: false,
      paused: false,
      latest: [],
      status: null,
      seriesById: new Map()
    };

    const colors = ["#9be870", "#63c8ff", "#ffb25b", "#d28cff", "#ff7f99", "#67e0c5"];
    const viewDetails = {
      temperature: { label: "Temperature trend", unit: "C", min: null, max: null, type: "Temperature", value: "temperature" },
      loadPercent: { label: "Load % trend", unit: "%", min: 0, max: 100, type: "Load", value: "sensor" },
      power: { label: "Power trend", unit: "W", min: 0, max: null, type: "Power", value: "sensor" },
      fanPercent: { label: "Fan % trend", unit: "%", min: 0, max: 100, type: "Control", value: "control" },
      fanRpm: { label: "Fan RPM trend", unit: "RPM", min: 0, max: null, type: "Fan", value: "rpm" }
    };

    const elements = {
      temperatureGrid: document.getElementById("temperature-grid"),
      performanceGrid: document.getElementById("performance-grid"),
      fanGrid: document.getElementById("fan-grid"),
      statusDot: document.getElementById("status-dot"),
      statusText: document.getElementById("status-text"),
      lastSample: document.getElementById("last-sample"),
      sensorCount: document.getElementById("sensor-count"),
      notice: document.getElementById("notice"),
      rangeSelect: document.getElementById("range-select"),
      pause: document.getElementById("pause-refresh"),
      copySummary: document.getElementById("copy-summary"),
      newLog: document.getElementById("new-log"),
      resetLog: document.getElementById("reset-log"),
      chart: document.getElementById("trend-chart"),
      legend: document.getElementById("legend"),
      table: document.getElementById("sensor-table"),
      tableCount: document.getElementById("table-count"),
      logPath: document.getElementById("log-path"),
      chartHeading: document.getElementById("chart-heading"),
      chartCaption: document.getElementById("chart-caption"),
      optionalFans: document.getElementById("toggle-optional-fans")
    };

    document.querySelectorAll("[data-view]").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll("[data-view]").forEach(item => item.classList.toggle("active", item === button));
        state.view = button.dataset.view;
        state.selected.clear();
        if (state.view === "temperature") {
          temperatureConfig.forEach(item => state.selected.add(item.key));
        } else if (state.view === "loadPercent" || state.view === "power") {
          performanceConfig
            .filter(item => item.chartView === state.view)
            .forEach(item => state.selected.add(item.key));
        } else {
          getFanConfigs().forEach(item => state.selected.add(item.key));
        }
        refresh();
      });
    });

    elements.optionalFans.addEventListener("click", () => {
      state.showOptionalFans = !state.showOptionalFans;

      if (state.showOptionalFans && state.view !== "temperature") {
        getFanConfigs().forEach(item => state.selected.add(item.key));
      } else {
        fanConfig.filter(item => item.hidden).forEach(item => state.selected.delete(item.key));
      }

      refresh();
    });

    elements.rangeSelect.addEventListener("change", () => {
      state.minutes = Number(elements.rangeSelect.value);
      refresh();
    });

    elements.pause.addEventListener("click", () => {
      state.paused = !state.paused;
      elements.pause.textContent = state.paused ? "Resume" : "Pause";
      if (!state.paused) {
        refresh();
      }
    });

    elements.newLog.addEventListener("click", () => {
      runLogAction(elements.newLog, "/api/log/new", "New log");
    });

    elements.resetLog.addEventListener("click", () => {
      if (!confirm("Reset the active CSV log and clear chart history?")) {
        return;
      }

      runLogAction(elements.resetLog, "/api/log/reset", "Reset log");
    });

    elements.copySummary.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(buildSummaryText());
        elements.copySummary.textContent = "Copied";
        setTimeout(() => elements.copySummary.textContent = "Copy summary", 1500);
      } catch {
        elements.copySummary.textContent = "Copy failed";
        setTimeout(() => elements.copySummary.textContent = "Copy summary", 1500);
      }
    });

    window.addEventListener("resize", () => renderChart());

    async function refresh(force = false) {
      if (state.paused && !force) {
        return;
      }

      try {
        const [status, current] = await Promise.all([
          fetchJson("/api/status"),
          fetchJson("/api/current")
        ]);

        state.status = status;
        state.latest = current.readings || [];

        const visible = getVisibleItems();
        const sensorIds = [...new Set(visible.map(item => item.sensor?.sensorId).filter(Boolean))];
        const series = sensorIds.length
          ? await fetchJson(`/api/series?minutes=${state.minutes}&sensorIds=${encodeURIComponent(sensorIds.join(","))}`)
          : { series: [] };

        state.seriesById = new Map((series.series || []).map(item => [item.sensorId, item]));

        updateStatus();
        renderCards();
        renderTable();
        renderChart();
      } catch (error) {
        showNotice(`Dashboard refresh failed: ${error.message}`);
        elements.statusDot.className = "status-dot bad";
        elements.statusText.textContent = "Refresh failed";
      }
    }

    async function fetchJson(url) {
      const response = await fetch(url, { cache: "no-store" });
      if (!response.ok) {
        throw new Error(await response.text());
      }
      return response.json();
    }

    async function postJson(url) {
      const response = await fetch(url, { method: "POST", cache: "no-store" });
      if (!response.ok) {
        throw new Error(await response.text());
      }
      return response.json();
    }

    async function runLogAction(button, url, label) {
      const originalText = button.textContent;
      button.disabled = true;
      button.textContent = "Working";

      try {
        const result = await postJson(url);
        state.seriesById = new Map();
        await refresh(true);
        showNotice(`${result.message} Active log: ${result.activeLogFileName}`);
      } catch (error) {
        showNotice(`${label} failed: ${error.message}`);
      } finally {
        button.disabled = false;
        button.textContent = originalText;
      }
    }

    function updateStatus() {
      const status = state.status || {};
      elements.statusDot.className = `status-dot ${status.lastError ? "bad" : status.latestReadingCount > 0 ? "good" : ""}`;
      elements.statusText.textContent = status.lastError ? "Sensor error" : status.latestReadingCount > 0 ? "Logging" : "Starting";
      elements.sensorCount.textContent = `${getVisibleItems().filter(item => item.sensor).length} focused readings`;
      elements.logPath.textContent = status.activeLogFileName ? `Log: ${status.activeLogFileName}` : status.logDirectory ? `Logs: ${status.logDirectory}` : "";
      elements.logPath.title = status.activeLogPath || status.logDirectory || "";

      if (status.latestTimestampUtc) {
        const liveEvery = formatInterval(status.pollIntervalSeconds);
        const logEvery = formatInterval(status.logIntervalSeconds || 5);
        elements.lastSample.textContent = `Live ${liveEvery} - logs ${logEvery} - last ${formatTime(status.latestTimestampUtc)}`;
      } else {
        elements.lastSample.textContent = "Waiting for first sample";
      }

      if (status.lastError || status.note) {
        showNotice(status.lastError || status.note);
      } else {
        hideNotice();
      }
    }

    function renderCards() {
      const temperatureItems = temperatureConfig.map(config => makeTemperatureItem(config));
      const performanceItems = performanceConfig.map(config => makePerformanceItem(config));
      const fanItems = getFanConfigs().map(config => makeFanItem(config));

      elements.optionalFans.textContent = state.showOptionalFans ? "Hide optional fans" : "Show optional fans";

      elements.temperatureGrid.innerHTML = temperatureItems.map(item => renderTemperatureCard(item)).join("");
      elements.performanceGrid.innerHTML = performanceItems.map(item => renderPerformanceCard(item)).join("");
      elements.fanGrid.innerHTML = fanItems.map(item => renderFanCard(item)).join("");

      document.querySelectorAll("[data-select-key]").forEach(card => {
        card.addEventListener("click", () => {
          const key = card.dataset.selectKey;
          const targetView = card.dataset.selectView;
          if (state.view !== targetView) {
            state.view = targetView;
            document.querySelectorAll("[data-view]").forEach(button => button.classList.toggle("active", button.dataset.view === targetView));
            state.selected.clear();
          }

          if (state.selected.has(key)) {
            state.selected.delete(key);
          } else {
            state.selected.add(key);
          }

          renderCards();
          renderTable();
          renderChart();
        });
      });
    }

    function renderTemperatureCard(item) {
      const missing = item.sensor ? "" : " missing";
      const active = item.sensor && state.view === "temperature" && state.selected.has(item.key) ? " active" : "";
      const value = item.sensor ? `${formatValue(item.sensor.value)} C` : "--";
      return `
        <button class="sensor-card${missing}${active}" type="button" data-select-key="${escapeAttribute(item.key)}" data-select-view="temperature">
          <span class="topline">
            <span class="name">${escapeHtml(item.label)}</span>
            <span class="subtle">C</span>
          </span>
          <span class="hardware">${escapeHtml(item.hardware)}</span>
          <span class="value-row">
            <span class="value">${escapeHtml(value)}</span>
          </span>
          ${sparkline(item.sensor?.sensorId)}
        </button>
      `;
    }

    function renderFanCard(item) {
      const missing = item.control || item.rpm ? "" : " missing";
      const viewKey = state.view === "fanRpm" ? "fanRpm" : "fanPercent";
      const active = (item.control || item.rpm) && (state.view === "fanPercent" || state.view === "fanRpm") && state.selected.has(item.key) ? " active" : "";
      const percent = item.control ? `${formatValue(item.control.value)} %` : "--";
      const rpm = item.rpm ? `${formatValue(item.rpm.value)} RPM` : "-- RPM";
      const sparkId = state.view === "fanRpm" ? item.rpm?.sensorId : item.control?.sensorId;
      return `
        <button class="sensor-card${missing}${active}" type="button" data-select-key="${escapeAttribute(item.key)}" data-select-view="${viewKey}">
          <span class="topline">
            <span class="name">${escapeHtml(item.label)}</span>
            <span class="subtle">fan</span>
          </span>
          <span class="hardware">${escapeHtml(item.hardware || "FanControl label")}</span>
          <span class="value-row">
            <span class="value">${escapeHtml(percent)}</span>
            <span class="rpm">${escapeHtml(rpm)}</span>
          </span>
          ${sparkline(sparkId)}
        </button>
      `;
    }

    function renderPerformanceCard(item) {
      const missing = item.sensor ? "" : " missing";
      const active = item.sensor && state.view === item.chartView && state.selected.has(item.key) ? " active" : "";
      const value = item.sensor ? `${formatValue(item.sensor.value)} ${item.unit}` : "--";
      return `
        <button class="sensor-card${missing}${active}" type="button" data-select-key="${escapeAttribute(item.key)}" data-select-view="${escapeAttribute(item.chartView)}">
          <span class="topline">
            <span class="name">${escapeHtml(item.label)}</span>
            <span class="subtle">${escapeHtml(item.unit)}</span>
          </span>
          <span class="hardware">${escapeHtml(item.hardware)}</span>
          <span class="value-row">
            <span class="value">${escapeHtml(value)}</span>
          </span>
          ${sparkline(item.sensor?.sensorId)}
        </button>
      `;
    }

    function sparkline(sensorId) {
      const series = sensorId ? state.seriesById.get(sensorId) : null;
      if (!series || series.points.length < 2) {
      return `<svg class="mini-curve" viewBox="0 0 200 34" aria-hidden="true"><path class="spark" d="M0 33 L200 33"></path></svg>`;
      }

      const values = series.points.map(point => point.value);
      const min = Math.min(...values);
      const max = Math.max(...values);
      const span = Math.max(1, max - min);
      const width = 200;
      const height = 34;
      const points = series.points.map((point, index) => {
        const x = (index / Math.max(1, series.points.length - 1)) * width;
        const y = height - 4 - ((point.value - min) / span) * 22;
        return `${round(x)},${round(y)}`;
      });

      return `<svg class="mini-curve" viewBox="0 0 200 34" aria-hidden="true"><polyline class="spark" points="0,34 ${points.join(" ")} 200,34"></polyline><circle class="dot" cx="${points[points.length - 1].split(",")[0]}" cy="${points[points.length - 1].split(",")[1]}" r="3"></circle></svg>`;
    }

    function renderTable() {
      const rows = getVisibleItems().filter(item => item.sensor);

      elements.tableCount.textContent = `${rows.length} shown from configured list`;

      if (rows.length === 0) {
        elements.table.innerHTML = `<tr><td colspan="4">No configured sensors are currently available. Try running as Administrator if motherboard sensors are missing.</td></tr>`;
        return;
      }

      elements.table.innerHTML = rows.map(item => `
        <tr>
          <td>${escapeHtml(item.label)}</td>
          <td>${escapeHtml(item.hardware || item.sensor.hardware)}</td>
          <td>${escapeHtml(item.kind)}</td>
          <td class="value">${formatValue(item.sensor.value)} ${escapeHtml(item.sensor.unit)}</td>
        </tr>
      `).join("");
    }

    function renderChart() {
      const detail = viewDetails[state.view];
      elements.chartHeading.textContent = detail.label;

      const items = getChartItems();
      elements.chartCaption.textContent = items.length
        ? `${items.length} selected over ${state.minutes} minutes`
        : "Select cards above to add lines";

      const svg = elements.chart;
      const width = Math.max(320, Math.floor(svg.clientWidth || svg.getBoundingClientRect().width || 900));
      const height = Math.max(300, Math.floor(svg.clientHeight || 340));
      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);

      const selected = items
        .map(item => ({ ...item, series: item.sensor ? state.seriesById.get(item.sensor.sensorId) : null }))
        .filter(item => item.series && item.series.points.length > 0);

      elements.chartCaption.textContent = items.length
        ? `${selected.length} available / ${items.length} selected over ${state.minutes} minutes`
        : "Select cards above to add lines";

      const padding = { top: 18, right: 18, bottom: 40, left: 56 };
      const plotWidth = width - padding.left - padding.right;
      const plotHeight = height - padding.top - padding.bottom;

      if (selected.length === 0) {
        svg.innerHTML = `
          <title id="chart-title">Telemetry trend chart</title>
          <desc id="chart-desc">No selected series to chart.</desc>
          <text x="${width / 2}" y="${height / 2}" text-anchor="middle" class="axis-text">No selected data yet</text>
        `;
        elements.legend.innerHTML = "";
        return;
      }

      const allPoints = selected.flatMap(item => item.series.points);
      const times = allPoints.map(point => new Date(point.timestampUtc).getTime());
      const values = allPoints.map(point => point.value);
      const xMin = Math.min(...times);
      const xMax = Math.max(...times);
      let yMin = detail.min === null ? Math.min(...values) : detail.min;
      let yMax = detail.max === null ? Math.max(...values) : detail.max;

      if (yMin === yMax) {
        yMin -= 1;
        yMax += 1;
      }

      if (detail.min === null) {
        const downStep = state.view === "fanRpm" ? 250 : 5;
        yMin = Math.floor(yMin / downStep) * downStep;
      }

      if (detail.max === null) {
        const upStep = state.view === "fanRpm" ? 250 : 5;
        yMax = Math.ceil(yMax / upStep) * upStep;
      }

      const xScale = value => padding.left + ((value - xMin) / Math.max(1, xMax - xMin)) * plotWidth;
      const yScale = value => padding.top + (1 - ((value - yMin) / Math.max(1, yMax - yMin))) * plotHeight;
      const yTicks = makeTicks(yMin, yMax, 5);
      const xTicks = makeTimeTicks(xMin, xMax, 5);
      const lines = [];

      yTicks.forEach(tick => {
        const y = yScale(tick);
        lines.push(`<line class="grid-line" x1="${padding.left}" y1="${y}" x2="${width - padding.right}" y2="${y}"></line>`);
        lines.push(`<text class="axis-text" x="${padding.left - 8}" y="${y + 4}" text-anchor="end">${formatValue(tick)}</text>`);
      });

      xTicks.forEach(tick => {
        const x = xScale(tick);
        lines.push(`<line class="grid-line" x1="${x}" y1="${padding.top}" x2="${x}" y2="${height - padding.bottom}"></line>`);
        lines.push(`<text class="axis-text" x="${x}" y="${height - 13}" text-anchor="middle">${formatTimeShort(tick)}</text>`);
      });

      lines.push(`<line class="axis-line" x1="${padding.left}" y1="${height - padding.bottom}" x2="${width - padding.right}" y2="${height - padding.bottom}"></line>`);
      lines.push(`<line class="axis-line" x1="${padding.left}" y1="${padding.top}" x2="${padding.left}" y2="${height - padding.bottom}"></line>`);
      lines.push(`<text class="chart-label" x="8" y="${padding.top + 10}">${escapeHtml(detail.unit)}</text>`);

      selected.forEach((item, index) => {
        const path = item.series.points.map((point, pointIndex) => {
          const x = xScale(new Date(point.timestampUtc).getTime());
          const y = yScale(point.value);
          return `${pointIndex === 0 ? "M" : "L"}${round(x)} ${round(y)}`;
        }).join(" ");

        const color = colors[index % colors.length];
        lines.push(`<path class="series-line" d="${path}" stroke="${color}"></path>`);
        const last = item.series.points[item.series.points.length - 1];
        lines.push(`<circle cx="${round(xScale(new Date(last.timestampUtc).getTime()))}" cy="${round(yScale(last.value))}" r="3.5" fill="${color}"></circle>`);
      });

      svg.innerHTML = `
        <title id="chart-title">Telemetry trend chart</title>
        <desc id="chart-desc">${escapeHtml(detail.label)}.</desc>
        ${lines.join("")}
      `;

      elements.legend.innerHTML = selected.map((item, index) => {
        const last = item.series.points[item.series.points.length - 1];
        return `
          <div class="legend-item">
            <span class="swatch" style="background:${colors[index % colors.length]}"></span>
            <span>${escapeHtml(item.label)} (${formatValue(last.value)} ${escapeHtml(item.sensor.unit)})</span>
          </div>
        `;
      }).join("");
    }

    function getVisibleItems() {
      const temperatureItems = temperatureConfig.map(config => makeTemperatureItem(config));
      const performanceItems = performanceConfig.map(config => makePerformanceItem(config));
      const fanItems = getFanConfigs().flatMap(config => {
        const item = makeFanItem(config);
        const rows = [];
        if (item.control) {
          rows.push({ key: `${item.key}-control`, label: item.label, hardware: item.hardware, kind: "Fan %", sensor: item.control });
        }
        if (item.rpm) {
          rows.push({ key: `${item.key}-rpm`, label: item.label, hardware: item.hardware, kind: "RPM", sensor: item.rpm });
        }
        return rows;
      });

      return [
        ...temperatureItems.map(item => ({ key: item.key, label: item.label, hardware: item.hardware, kind: "Temperature", sensor: item.sensor })),
        ...performanceItems.map(item => ({ key: item.key, label: item.label, hardware: item.hardware, kind: item.sensorType === "Power" ? "Power" : "Load %", sensor: item.sensor })),
        ...fanItems
      ];
    }

    function getChartItems() {
      if (state.view === "temperature") {
        return temperatureConfig
          .map(config => makeTemperatureItem(config))
          .filter(item => state.selected.has(item.key));
      }

      if (state.view === "loadPercent" || state.view === "power") {
        return performanceConfig
          .filter(config => config.chartView === state.view)
          .map(config => makePerformanceItem(config))
          .filter(item => state.selected.has(item.key))
          .map(item => ({ key: item.key, label: item.label, hardware: item.hardware, sensor: item.sensor }));
      }

      const valueKey = viewDetails[state.view].value;
      return getFanConfigs()
        .map(config => makeFanItem(config))
        .filter(item => state.selected.has(item.key))
        .map(item => ({ key: item.key, label: item.label, hardware: item.hardware, sensor: item[valueKey] }));
    }

    function getFanConfigs() {
      return fanConfig.filter(item => state.showOptionalFans || !item.hidden);
    }

    function makeTemperatureItem(config) {
      const sensor = findReading("Temperature", config);
      return {
        ...config,
        sensor,
        hardware: sensor?.hardware || config.hardware
      };
    }

    function makeFanItem(config) {
      const control = findReading("Control", config);
      const rpm = findReading("Fan", config);
      return {
        ...config,
        control,
        rpm,
        hardware: control?.hardware || rpm?.hardware || config.hardware || "Gigabyte X870 AORUS ELITE WIFI7"
      };
    }

    function makePerformanceItem(config) {
      const sensor = findReading(config.sensorType, config);
      return {
        ...config,
        sensor,
        hardware: sensor?.hardware || config.hardware
      };
    }

    function findReading(type, config) {
      const hardwareCandidates = state.latest.filter(reading => {
        if (reading.sensorType !== type) {
          return false;
        }

        const hardwareMatch = !config.hardware || sameText(reading.hardware, config.hardware) || reading.hardware.includes(config.hardware) || config.hardware.includes(reading.hardware);
        return hardwareMatch;
      });

      const exactCandidates = hardwareCandidates.filter(reading =>
        config.names.some(name => sameText(reading.name, name)));

      if (exactCandidates.length > 0) {
        return exactCandidates[0];
      }

      if (config.exactNameOnly) {
        return null;
      }

      const candidates = hardwareCandidates.filter(reading =>
        config.names.some(name => normalizeText(reading.name).includes(normalizeText(name)) || normalizeText(name).includes(normalizeText(reading.name))));

      if (candidates.length > 0) {
        return candidates[0];
      }

      if (type === "Temperature" && config.key === "nvidia-gpu") {
        return state.latest.find(reading => reading.sensorType === "Temperature" && reading.hardware.includes("NVIDIA") && reading.name === "GPU Core") || null;
      }

      if ((type === "Control" || type === "Fan") && config.key.startsWith("gpu-")) {
        return state.latest.find(reading => reading.sensorType === type && reading.hardware.includes("NVIDIA") && sameText(reading.name, config.label)) || null;
      }

      return null;
    }

    function buildSummaryText() {
      const lines = [
        "PC telemetry focused summary",
        `Sample time: ${state.status?.latestTimestampUtc ? new Date(state.status.latestTimestampUtc).toLocaleString() : "not sampled yet"}`,
        ""
      ];

      getVisibleItems()
        .filter(item => item.sensor)
        .forEach(item => {
          lines.push(`${item.label} - ${item.hardware}: ${formatValue(item.sensor.value)} ${item.sensor.unit} (${item.kind})`);
        });

      return lines.join("\n").trim();
    }

    function makeTicks(min, max, count) {
      if (count <= 1 || min === max) {
        return [min, max];
      }
      const step = (max - min) / (count - 1);
      return Array.from({ length: count }, (_, index) => min + step * index);
    }

    function makeTimeTicks(min, max, count) {
      if (min === max) {
        return [min];
      }
      const step = (max - min) / (count - 1);
      return Array.from({ length: count }, (_, index) => min + step * index);
    }

    function showNotice(message) {
      elements.notice.textContent = message;
      elements.notice.classList.add("visible");
    }

    function hideNotice() {
      elements.notice.textContent = "";
      elements.notice.classList.remove("visible");
    }

    function sameText(left, right) {
      return normalizeText(left) === normalizeText(right);
    }

    function normalizeText(value) {
      return String(value).trim().toLowerCase();
    }

    function formatValue(value) {
      if (!Number.isFinite(value)) {
        return "--";
      }
      if (Math.abs(value) >= 1000) {
        return Math.round(value).toLocaleString();
      }
      return value.toFixed(1);
    }

    function formatTime(value) {
      return new Date(value).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    }

    function formatTimeShort(value) {
      return new Date(value).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    function formatInterval(value) {
      if (!Number.isFinite(value)) {
        return "";
      }
      return value === 1 ? "1s" : `${value}s`;
    }

    function round(value) {
      return Math.round(value * 10) / 10;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeAttribute(value) {
      return escapeHtml(value).replaceAll("`", "&#096;");
    }

    refresh();
    setInterval(refresh, 1000);
  </script>
</body>
</html>
