[platformio]
default_envs = esp32-s3-super-mini

[env:esp32-s3-super-mini]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; This ESP32-S3 Super Mini has 4 MB physical flash. The DevKitC board profile
; defaults to 8 MB, which makes the ROM reject the image before setup() runs.
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = default.csv
lib_deps =
  moononournation/GFX Library for Arduino@1.4.9
build_unflags =
  -D ARDUINO_USB_MODE=1
build_flags =
  -D ARDUINO_USB_MODE=0
  -D ARDUINO_USB_CDC_ON_BOOT=0
  -D CORE_DEBUG_LEVEL=1
